name: Lint

# yggdrasil's lint module: actionlint and zizmor's pedantic audits over the
# workflows, and Semgrep's rule that a tagged Dockerfile FROM carries a digest
# (a repo with no Dockerfile scans nothing there).
#
# The default-branch ruleset requires `Lint / actionlint`, `Lint / zizmor` and
# `Lint / semgrep` (this job's name, then the module's); renaming either
# strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    uses: zimmertr/yggdrasil/.github/workflows/lint.yml@f5661bbe5864dfae07e6dbd603489e2326980b3d # v2.0.0
    permissions:
      contents: read # the module checks out the repo
