name: Lint

# yggdrasil's lint module: actionlint and zizmor's pedantic audits over the
# workflows, and Semgrep's rule that a tagged Dockerfile FROM carries a digest
# (a repo with no Dockerfile scans nothing there), shellcheck over any script
# file, and the docs' links and em dashes.
#
# The default-branch ruleset requires `Lint / actionlint`, `/ zizmor`,
# `/ semgrep`, `/ shellcheck` and `/ docs` (this job's name, then the
# module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    uses: zimmertr/yggdrasil/.github/workflows/lint.yml@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
    permissions:
      contents: read # the module checks out the repo
